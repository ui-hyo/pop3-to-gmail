[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email2gmail"
version = "0.1.0"
description = "Retain POP3 mail in Gmail with durable delivery tracking and Telegram health reports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
email2gmail = "email2gmail.cli:main"

[tool.setuptools.packages.find]
include = ["email2gmail*"]
